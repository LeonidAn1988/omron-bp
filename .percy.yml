# Настройки визуальной проверки. Прогон: npm run visual
version: 2

snapshot:
  # Ширины, на которых Percy перерисовывает снятую разметку.
  # 360 — самый узкий телефон, на нём и ломается всё интересное.
  # 768 — планшет, где сетка перестраивается.
  # 1280 — десктоп, куда уезжает нижняя навигация.
  widths: [360, 768, 1280]
  minHeight: 900

  # Что скрыть от сравнения: значения, меняющиеся сами по себе, дают
  # расхождение на каждом прогоне и топят в шуме настоящие правки.
  # Часы в самом прогоне заморожены, поэтому здесь остаётся немногое.
  percyCSS: |
    /* Полоса прокрутки рисуется по-разному от запуска к запуску. */
    ::-webkit-scrollbar { display: none; }

discovery:
  # Ждём затишья в сети перед снимком. Справочники лекарств и БАДов Percy в
  # снимок не тащит — он собирает то, что участвует в отрисовке (стили, шрифты,
  # картинки), а не ответы fetch, — но подождать их загрузки стоит: пока они
  # едут, форма препарата показывает поле без подсказок.
  network-idle-timeout: 750
